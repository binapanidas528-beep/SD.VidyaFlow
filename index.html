<!DOCTYPE html>
<html lang="or" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SD.VidyaFlow - India's #1 AI Study & Exam Companion</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- html2pdf Library for Instant PDF Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { background-color: #0b0f19; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass-card { background: #131b2e; border: 1px solid #1e293b; border-radius: 1rem; }
        .gradient-text { background: linear-gradient(135deg, #a855f7, #6366f1, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between py-4 px-3 md:px-6">

    <!-- App Header -->
    <header class="text-center mb-6">
        <div class="flex items-center justify-center space-x-3 mb-2">
            <div class="bg-indigo-600 p-2.5 rounded-2xl shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-graduation-cap text-yellow-300 text-3xl"></i>
            </div>
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-wide gradient-text">SD.VidyaFlow</h1>
        </div>
        <p class="text-xs md:text-sm text-slate-400 font-medium">India's #1 AI Study & Exam Companion • Class 5 to PhD (All Boards & Universities)</p>
    </header>

    <main class="max-w-5xl mx-auto w-full space-y-6 flex-grow">

        <!-- Student Preference & Language Panel -->
        <div class="glass-card p-5 space-y-4">
            <div class="border-b border-slate-800 pb-2 flex justify-between items-center">
                <span class="text-xs font-bold text-indigo-400 uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-amber-400"></i> Student Profile & Language Setup
                </span>
                <span class="text-[10px] bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-full border border-emerald-500/20 font-semibold">
                    <i class="fa-solid fa-circle text-[8px] animate-pulse mr-1"></i> Live AI Mentor
                </span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- Class Selection -->
                <div>
                    <label class="block text-xs text-slate-400 font-semibold mb-1">SELECT CLASS / LEVEL</label>
                    <select id="classSelect" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-lg p-3 outline-none focus:border-indigo-500">
                        <option value="Class 5 to 8 (Primary & Middle)">Class 5 - 8 (School Level)</option>
                        <option value="Class 9 & 10 (Secondary / Board Exams)">Class 9 & 10 (Matric Board)</option>
                        <option value="Class 11 & 12 (Higher Secondary)">Class 11 & 12 (CHSE / CBSE / WB)</option>
                        <option value="Undergraduate (BA / B.Sc / B.Tech / B.Com)">College Undergraduate (UG)</option>
                        <option value="Postgraduate (MA / M.Sc / M.Tech / M.Com)">Postgraduate (Master's - PG)</option>
                        <option value="PhD / Research / Doctorate">PhD & Advanced Research</option>
                        <option value="Competitive Exam (TGT / B.Ed / NET / SET)">Competitive Exam (TGT / B.Ed / NET)</option>
                    </select>
                </div>

                <!-- Language Selection -->
                <div>
                    <label class="block text-xs text-slate-400 font-semibold mb-1">SELECT MEDIUM / LANGUAGE</label>
                    <select id="langSelect" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-lg p-3 outline-none focus:border-indigo-500">
                        <option value="Odia">Odia (ଓଡ଼ିଆ)</option>
                        <option value="Hindi">Hindi (हिंदी)</option>
                        <option value="Bengali">Bengali (বাংলা)</option>
                        <option value="English">English</option>
                    </select>
                </div>

                <!-- Mode Selection -->
                <div>
                    <label class="block text-xs text-slate-400 font-semibold mb-1">AI ASSISTANT MODE</label>
                    <select id="modeSelect" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-lg p-3 outline-none focus:border-indigo-500">
                        <option value="Exam Paper & Question Answer Generator">Exam Questions & Answers Generator</option>
                        <option value="Deep Doubt Resolver & Topic Explanation">Deep Doubt Resolver & Mentor</option>
                        <option value="Quick Revision Notes Generator">Quick Revision Notes & Formula Sheet</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Main Query / Exam Generator Box -->
        <section class="glass-card p-6 space-y-4">
            <h2 class="text-sm font-bold text-slate-200 uppercase tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles text-indigo-400"></i> Enter Subject, Topic, or University/Board Name
            </h2>

            <textarea id="userInput" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 text-sm text-slate-200 outline-none focus:border-indigo-500 resize-none" placeholder="E.g., Class 10 Physical Science Chapter 2, Utkal University BA 3rd Sem History Paper, ya koi bhi question yahan pucho..."></textarea>

            <button id="generateBtn" onclick="generateContent(false)" class="w-full bg-gradient-to-r from-indigo-600 via-purple-600 to-blue-600 hover:opacity-90 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-indigo-600/30 transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-bolt text-yellow-300"></i>
                <span>Generate Exam Questions & Detailed Answers</span>
            </button>
        </section>

        <!-- Response Output Box -->
        <section id="resultSection" class="glass-card p-6 space-y-4 hidden">
            <div class="flex flex-wrap justify-between items-center border-b border-slate-800 pb-3 gap-2">
                <span class="text-xs font-bold text-indigo-400 uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-file-lines text-emerald-400"></i> Generated Study Document
                </span>
                <div class="flex items-center space-x-2">
                    <!-- PDF Download Button -->
                    <button onclick="downloadPDF()" class="bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-500/30 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center space-x-1.5 transition">
                        <i class="fa-solid fa-file-pdf"></i>
                        <span>Download PDF</span>
                    </button>
                </div>
            </div>

            <!-- Content Area -->
            <div id="pdfContent" class="bg-slate-900/90 border border-slate-800 rounded-xl p-6 text-sm text-slate-200 whitespace-pre-wrap leading-relaxed min-h-[300px]"></div>

            <!-- "Aur Bhi Exam Questions Do" Load More Button -->
            <div class="flex justify-center pt-2">
                <button id="loadMoreBtn" onclick="generateContent(true)" class="bg-slate-800 hover:bg-slate-700 border border-indigo-500/40 text-indigo-300 hover:text-white font-semibold py-2.5 px-6 rounded-xl text-xs flex items-center space-x-2 transition">
                    <i class="fa-solid fa-plus-circle text-indigo-400"></i>
                    <span>Aur Bhi Exam Main Aane Wale Questions Do (Load More)</span>
                </button>
            </div>
        </section>

    </main>

    <footer class="text-center text-xs text-slate-500 mt-8 border-t border-slate-800/80 pt-4">
        SD.VidyaFlow &copy; 2026 • The Ultimate AI Sanjeevani for Students (Class 5 to PhD)
    </footer>

    <!-- Logic Script -->
    <script>
        let fullGeneratedText = "";

        async function generateContent(isLoadMore) {
            const level = document.getElementById('classSelect').value;
            const lang = document.getElementById('langSelect').value;
            const mode = document.getElementById('modeSelect').value;
            const topic = document.getElementById('userInput').value.trim();
            const btn = document.getElementById('generateBtn');
            const loadBtn = document.getElementById('loadMoreBtn');
            const resultBox = document.getElementById('resultSection');
            const contentDisplay = document.getElementById('pdfContent');

            if (!topic) {
                alert("Kripya pehle koi Subject, Chapter name, ya Exam topic enter karein!");
                return;
            }

            resultBox.classList.remove('hidden');

            if (!isLoadMore) {
                contentDisplay.innerText = `[SD.VidyaFlow AI Mentor Processing...]\n\nSearching exam databases for ${level} in ${lang} medium...\nGenerating 2-3 pages detailed exam questions and step-by-step answers...`;
                fullGeneratedText = "";
            } else {
                loadBtn.innerText = "Generating More Questions...";
            }

            // Constructing Prompt
            let prompt = "";
            if (isLoadMore) {
                prompt = `Provide 10 MORE unique, highly important exam questions with complete detailed answers for level: ${level}, Subject/Topic: "${topic}" in language: ${lang}. Ensure answers are step-by-step, accurate, and ready for exams.`;
            } else {
                prompt = `Act as India's Top Academic Mentor and Exam Setter. Generate a detailed 2-3 pages comprehensive exam study guide for level: ${level}, Subject/Topic: "${topic}" in language: ${lang}. Mode: ${mode}. Include:
1. Top 5-10 Most Expected Exam Questions with Full Answers.
2. Step-by-Step Concepts, Definitions, & Formulas (if any).
3. Expert Tips to score 100% marks in exams.
IMPORTANT: Respond completely in ${lang} language!`;
            }

            try {
                // Call Cloudflare API Worker Backend
                const response = await fetch('https://vidyaflow-api.binapanidas528.workers.dev', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });

                if (!response.ok) {
                    throw new Error(`Server status ${response.status}`);
                }

                const data = await response.json();
                const aiResult = data.answer || data.text || data.quiz || "Response generated successfully.";

                if (isLoadMore) {
                    fullGeneratedText += `\n\n========================================\nADDITIONAL EXAM QUESTIONS & ANSWERS\n========================================\n\n` + aiResult;
                } else {
                    fullGeneratedText = aiResult;
                }

                contentDisplay.innerText = fullGeneratedText;

            } catch (err) {
                contentDisplay.innerText = `[SD.VidyaFlow Note]\n\nTopic: ${topic}\nLevel: ${level}\nLanguage: ${lang}\n\nUnable to connect to live AI worker (${err.message}). Ensure GEMINI_API_KEY is configured in Cloudflare environment variables.`;
            } finally {
                loadBtn.innerText = "Aur Bhi Exam Main Aane Wale Questions Do (Load More)";
            }
        }

        // PDF Generation Function
        function downloadPDF() {
            const element = document.getElementById('pdfContent');
            const opt = {
                margin:       0.5,
                filename:     'SD_VidyaFlow_Exam_Notes.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
