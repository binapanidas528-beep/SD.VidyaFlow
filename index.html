<!DOCTYPE html>
<html lang="or" id="html-root" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SD.VidyaFlow - AI Study Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col p-6">

    <div class="max-w-3xl mx-auto w-full space-y-6">
        <header class="text-center py-4 border-b border-slate-700">
            <h1 class="text-2xl font-bold text-indigo-400">⚡ SD.VidyaFlow AI Companion</h1>
            <p class="text-xs text-slate-400">Class 5 to PhD / TGT Multi-Language AI</p>
        </header>

        <!-- Quiz Section -->
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-4">
            <h2 class="text-lg font-bold text-indigo-300">🎯 AI Quiz Generator</h2>
            <div class="flex gap-2">
                <input type="text" id="quiz-topic" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white" placeholder="Topic enter karein (e.g. Computer Science)...">
                <button onclick="generateQuiz()" id="quiz-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-5 py-3 rounded-xl font-semibold">Generate Quiz ✨</button>
            </div>
            <div id="quiz-output" class="hidden p-4 bg-slate-900 rounded-xl text-xs space-y-2 border border-slate-700 text-slate-200"></div>
        </div>

        <!-- Doubt Resolver Section -->
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-4">
            <h2 class="text-lg font-bold text-indigo-300">💡 Instant AI Doubt Resolver</h2>
            <textarea id="doubt-input" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white" placeholder="Apna sawal yahan likhein..."></textarea>
            <button onclick="getAnswer()" id="doubt-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs py-3 rounded-xl font-semibold">Ask AI ✨</button>
            <div id="answer-box" class="hidden p-4 bg-slate-900 rounded-xl text-xs space-y-2 border border-slate-700 text-slate-200"></div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://vidyaflow-api.binapanidas528.workers.dev";

        async function fetchAIResponse(userPrompt) {
            try {
                const res = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: userPrompt })
                });

                const data = await res.json();
                if (data.error) return `<strong>Error:</strong> ${data.error.message || data.error}`;
                if (data.candidates && data.candidates[0] && data.candidates[0].content) {
                    return data.candidates[0].content.parts[0].text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
                }
                return `<strong>AI Error:</strong> Response not generated.`;
            } catch (err) {
                return `<strong>Connection Error:</strong> ${err.message}`;
            }
        }

        async function generateQuiz() {
            const topic = document.getElementById('quiz-topic').value.trim();
            if(!topic) return alert('Topic enter karein!');
            const out = document.getElementById('quiz-output');
            const btn = document.getElementById('quiz-btn');

            btn.innerText = "Generating... ⏳";
            btn.disabled = true;

            const res = await fetchAIResponse(`Generate 3 MCQs with answers on topic: ${topic}`);
            out.classList.remove('hidden');
            out.innerHTML = res;

            btn.innerText = "Generate Quiz ✨";
            btn.disabled = false;
        }

        async function getAnswer() {
            const doubt = document.getElementById('doubt-input').value.trim();
            if(!doubt) return alert('Doubt enter karein!');
            const box = document.getElementById('answer-box');
            const btn = document.getElementById('doubt-btn');

            btn.innerText = "Asking AI... ⏳";
            btn.disabled = true;

            const res = await fetchAIResponse(doubt);
            box.classList.remove('hidden');
            box.innerHTML = `<strong>Answer:</strong><br>${res}`;

            btn.innerText = "Ask AI ✨";
            btn.disabled = false;
        }
    </script>
</body>
</html>
