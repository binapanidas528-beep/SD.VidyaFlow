<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SD.VidyaFlow AI Companion</title>
    <style>
        body { 
            background-color: #0b0f19; 
            color: #f8fafc; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
        }
        .container { max-width: 700px; margin: 0 auto; }
        .glass-card { 
            background: #131b2e; 
            border: 1px solid #1e293b; 
            border-radius: 1rem; 
            padding: 1.5rem; 
            margin-bottom: 1.5rem; 
        }
        select, input, textarea { 
            width: 100%; 
            background: #0b0f19; 
            color: #fff; 
            border: 1px solid #1e293b; 
            padding: 10px; 
            border-radius: 8px; 
            margin-top: 5px; 
            margin-bottom: 15px; 
            box-sizing: border-box;
        }
        button { 
            background-color: #4f46e5; 
            color: white; 
            border-radius: 0.5rem; 
            font-weight: 500; 
            border: none; 
            padding: 0.7rem 1rem; 
            width: 100%; 
            cursor: pointer; 
        }
        button:hover { background-color: #4338ca; }
        .output { 
            background: #1e293b; 
            padding: 15px; 
            border-radius: 8px; 
            margin-top: 15px; 
            white-space: pre-wrap; 
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align: center; font-size: 26px;">⚡ SD.VidyaFlow AI Companion</h1>
    <p style="text-align: center; color: #94a3b8; font-size: 13px;">Class 5 to PhD / TGT Multi-Language AI Assistant</p>

    <div class="glass-card">
        <label style="font-size: 12px; color: #818cf8;">SELECT CLASS / LEVEL</label>
        <select id="selectClass">
            <option>TGT / B.Ed / Teaching Aspirants</option>
            <option>Class 10 - High School</option>
            <option>Class 12 - Senior Secondary</option>
            <option>UG / Graduate Level</option>
            <option>PG & PhD Research Level</option>
        </select>

        <label style="font-size: 12px; color: #818cf8;">SELECT MEDIUM / LANGUAGE</label>
        <select id="selectLang">
            <option>Hindi (हिंदी)</option>
            <option>English</option>
            <option>Hinglish</option>
        </select>

        <label style="font-size: 12px; color: #fb923c;">ENTER TOPIC FOR QUIZ</label>
        <input type="text" id="quizTopic" placeholder="e.g. Computer Science, Physics, Pedagogy">
        
        <button onclick="generateQuiz()">Generate AI Quiz</button>
        <div id="quizOutput" class="output" style="display:none;"></div>
    </div>
</div>

<script>
    // Aapki AQ API Key yahan direct headers mein kaam karegi
    const apiKey = "AQ.Ab8RN6LPXsVMkE8jCOgokdsVEiQyD-VyBVJaGzI9i8lfuMKYMw";

    async function generateQuiz() {
        const topic = document.getElementById('quizTopic').value;
        const studentClass = document.getElementById('selectClass').value;
        const lang = document.getElementById('selectLang').value;
        const outputDiv = document.getElementById('quizOutput');
        
        if (!topic) {
            alert("Please enter a topic first!");
            return;
        }

        outputDiv.style.display = "block";
        outputDiv.innerText = "Generating AI Quiz using Gemini 1.5 Flash...";

        const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent";
        const prompt = `Level/Class: ${studentClass}. Language: ${lang}. Create a high-quality 3-question multiple choice quiz with answers on: ${topic}`;

        try {
            const response = await fetch(url, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "x-goog-api-key": apiKey  // Yeh header AQ key ko browser se direct authenticate karega
                },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });

            const data = await response.json();
            if (data.candidates && data.candidates[0].content) {
                outputDiv.innerText = data.candidates[0].content.parts[0].text;
            } else {
                outputDiv.innerText = "Error: " + JSON.stringify(data, null, 2);
            }
        } catch (error) {
            outputDiv.innerText = "Connection Error: " + error.message;
        }
    }
</script>

</body>
</html>
