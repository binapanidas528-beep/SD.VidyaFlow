<script>
    // Cloudflare Worker Live Proxy Endpoint matching screenshot 141
    const WORKER_PROXY_URL = "https://vidyaflow-api.binapanidas528.workers.dev";

    function toggleHelpModal() {
        document.getElementById('help-modal').classList.toggle('hidden');
    }

    function toggleTheme() {
        const html = document.getElementById('html-root');
        const icon = document.getElementById('theme-icon');
        if (html.classList.contains('dark')) {
            html.classList.remove('dark');
            icon.innerText = "🌙 Dark";
        } else {
            html.classList.add('dark');
            icon.innerText = "☀️ Light";
        }
    }

    function updateClassMode() {
        const val = document.getElementById('class-select').value;
        document.getElementById('mode-text').innerText = val;
    }

    function setQuickTopic(topic) {
        document.getElementById('quiz-topic').value = topic;
        generateQuiz();
        document.getElementById('quiz-section').scrollIntoView({ behavior: 'smooth' });
    }

    function printCleanPDF(elementId, title) {
        const content = document.getElementById(elementId).innerHTML;
        const printArea = document.getElementById('print-area');
        
        printArea.innerHTML = `
            <div style="font-family: Arial, sans-serif; padding: 20px; line-height: 1.6; color: #000;">
                <div style="border-bottom: 2px solid #4f46e5; padding-bottom: 8px; margin-bottom: 15px; display: flex; justify-content: space-between;">
                    <h2 style="color: #312e81; margin: 0;">${title}</h2>
                    <span style="font-size: 12px; color: #666;">SD.VidyaFlow AI Companion</span>
                </div>
                <div style="font-size: 14px;">${content}</div>
            </div>
        `;

        window.print();
    }

    // Timer Logic
    let timer = null;
    let timeLeft = 1500;

    function updateTimerDisplay() {
        let m = Math.floor(timeLeft / 60);
        let s = timeLeft % 60;
        document.getElementById('timer-display').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function startTimer() {
        if (timer !== null) return;
        timer = setInterval(() => {
            if(timeLeft > 0) { 
                timeLeft--; 
                updateTimerDisplay(); 
            } else { 
                clearInterval(timer); 
                timer = null;
                alert('Focus Sprint Complete! Take a break.'); 
            }
        }, 1000);
    }

    function pauseTimer() { 
        if (timer !== null) {
            clearInterval(timer); 
            timer = null; 
        }
    }

    function resetTimer() { 
        pauseTimer(); 
        timeLeft = 1500; 
        updateTimerDisplay(); 
    }

    // Cloudflare Worker Proxy Fetch Engine
    async function fetchAIResponse(userPrompt) {
        const cls = document.getElementById('class-select').value;
        const lang = document.getElementById('lang-select').value;

        const structuredPrompt = `You are SD.VidyaFlow, an elite AI study companion for students in India.
Target Student Level: ${cls}.
Language Requirement: Please respond accurately and comprehensively in ${lang} language.
User Request: ${userPrompt}

Provide a well-structured, clear, exam-oriented response. If the request is for a Quiz/MCQs, format it with clear questions, options (A, B, C, D), and correct answers. If it is a topic explanation, provide key takeaways and bullet points. Use simple HTML formatting like <strong>, <br>, <ul>, <li> where necessary.`;

        try {
            const res = await fetch(WORKER_PROXY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: structuredPrompt })
            });

            const data = await res.json();
            
            if (data.error) {
                return `<strong>Error:</strong> ${data.error}`;
            }

            if (data.candidates && data.candidates[0] && data.candidates[0].content) {
                let aiText = data.candidates[0].content.parts[0].text;
                return aiText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
            } else {
                return `<strong>AI Response:</strong> Could not retrieve a proper answer. Please try again.`;
            }
        } catch (err) {
            return `<strong>Connection Error:</strong> ${err.message}.`;
        }
    }

    // Quiz Generator
    async function generateQuiz() {
        const topic = document.getElementById('quiz-topic').value.trim();
        if(!topic) return alert('Kripya topic enter karein!');

        const box = document.getElementById('quiz-box');
        const out = document.getElementById('quiz-output');
        const btn = document.getElementById('quiz-btn');

        btn.innerText = "Generating Live Real-AI Quiz... ⏳";
        btn.disabled = true;

        const res = await fetchAIResponse(`Generate 3 high-quality practice MCQs with options (A, B, C, D) and correct answers on topic: ${topic}`);
        box.classList.remove('hidden');
        out.innerHTML = res;
        btn.innerText = "Generate Quiz ✨";
        btn.disabled = false;
    }

    // Summarizer
    async function summarizeText() {
        const txt = document.getElementById('summary-input').value.trim();
        if(!txt) return alert('Notes paste karein!');
        const box = document.getElementById('summary-box');
        const out = document.getElementById('summary-output');
        const btn = document.getElementById('summary-btn');

        btn.innerText = "Summarizing with Real AI... ⏳";
        btn.disabled = true;

        const res = await fetchAIResponse(`Summarize the following study text into bullet points: ${txt}`);
        box.classList.remove('hidden');
        out.innerHTML = res;
        btn.innerText = "Summarize Notes ✨";
        btn.disabled = false;
    }

    // Mind Map
    function createMindMap() {
        const topic = document.getElementById('map-topic').value.trim();
        if(!topic) return alert('Topic enter karein!');
        const out = document.getElementById('map-output');
        out.classList.remove('hidden');
        out.innerHTML = `<div class="p-2 font-bold text-indigo-400">[ ${topic} ]</div><div class="text-xs">├── Core Concept<br>├── Key Sub-topics<br>└── Practical Application</div>`;
    }

    // Doubt Resolver
    async function getAnswer() {
        const doubt = document.getElementById('doubt-input').value.trim();
        if(!doubt) return alert('Doubt enter karein!');

        const box = document.getElementById('answer-box');
        const btn = document.getElementById('doubt-btn');
        const voiceBtn = document.getElementById('voice-reader-btn');
        const pdfBtn = document.getElementById('pdf-download-btn');

        btn.innerText = "Asking Real Gemini AI... ⏳";
        btn.disabled = true;

        const res = await fetchAIResponse(doubt);
        box.classList.remove('hidden');
        box.innerHTML = `<strong class="text-indigo-400 text-base">SD.VidyaFlow AI Answer:</strong><div class="mt-2 text-slate-100 leading-relaxed">${res}</div>`;
        
        voiceBtn.classList.remove('hidden');
        pdfBtn.classList.remove('hidden');

        btn.innerText = "Get Answer ✨";
        btn.disabled = false;
    }

    function startVoiceInput() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!SpeechRecognition) return alert('Voice input not supported');
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-IN';
        recognition.start();
        recognition.onresult = (e) => {
            document.getElementById('doubt-input').value = e.results[0][0].transcript;
        };
    }

    function readAnswerAudio() {
        const text = document.getElementById('answer-box').innerText;
        if(!text) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
    }
</script>
